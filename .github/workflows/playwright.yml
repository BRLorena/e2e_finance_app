name: Playwright Tests

on:
  # Run on push to dev or master branch (on merge)
  push:
    branches: [dev, master]
  # Run on pull requests to dev or master
  pull_request:
    branches: [dev, master]
  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Restore test history
        uses: actions/cache@v4
        with:
          path: reports/test-history.json
          key: test-history-${{ github.ref }}
          restore-keys: |
            test-history-

      - name: Run Playwright tests
        id: test-run
        continue-on-error: true
        run: npx playwright test --workers=1

      - name: Upload Smart Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smart-report
          path: reports/
          retention-days: 30

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Save test history to cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: reports/test-history.json
          key: test-history-${{ github.ref }}-${{ github.run_id }}

      - name: Generate Test Summary
        if: always()
        run: |
          echo "# 📊 Playwright Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.test-run.outcome }}" == "failure" ]]; then
            echo "## ❌ Some Tests Failed" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ✅ All Tests Passed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📈 Smart Report" >> $GITHUB_STEP_SUMMARY
          echo "View the detailed test report with flakiness detection, stability scores, and performance trends on [GitHub Pages](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 Download artifacts from [workflow run](../../actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

      - name: Fail job if tests failed
        if: steps.test-run.outcome == 'failure'
        run: exit 1

  deploy-report:
    needs: test
    runs-on: ubuntu-latest
    if: always() && (github.event_name == 'push' || github.event_name == 'schedule') && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
    steps:
      - name: Download Smart Report
        uses: actions/download-artifact@v4
        with:
          name: smart-report
          path: smart-report

      - name: Prepare GitHub Pages content
        run: |
          mkdir -p gh-pages
          # Copy the smart report as index.html for GitHub Pages
          if [ -f "smart-report/smart-report.html" ]; then
            cp smart-report/smart-report.html gh-pages/index.html
          fi
          # Also keep the original filename
          cp -r smart-report/* gh-pages/ 2>/dev/null || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: gh-pages
          keep_files: false

  notify:
    needs: test
    runs-on: ubuntu-latest
    if: always() && vars.SLACK_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Download Smart Report
        uses: actions/download-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: smart-report
          path: reports

      - name: Send Slack notification
        run: |
          # Determine test status
          if [[ "${{ needs.test.result }}" == "success" ]]; then
            STATUS_EMOJI="✅"
            STATUS_TEXT="passed"
            COLOR="good"
          else
            STATUS_EMOJI="❌"
            STATUS_TEXT="failed"
            COLOR="danger"
          fi

          # Build Slack payload
          cat > slack-payload.json << EOF
          {
            "attachments": [
              {
                "color": "${COLOR}",
                "blocks": [
                  {
                    "type": "header",
                    "text": {
                      "type": "plain_text",
                      "text": "${STATUS_EMOJI} Playwright Tests ${STATUS_TEXT}",
                      "emoji": true
                    }
                  },
                  {
                    "type": "section",
                    "fields": [
                      {
                        "type": "mrkdwn",
                        "text": "*Repository:*\n${{ github.repository }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Branch:*\n${{ github.ref_name }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Triggered by:*\n${{ github.actor }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Event:*\n${{ github.event_name }}"
                      }
                    ]
                  },
                  {
                    "type": "actions",
                    "elements": [
                      {
                        "type": "button",
                        "text": {
                          "type": "plain_text",
                          "text": "📊 View Report",
                          "emoji": true
                        },
                        "url": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
                      },
                      {
                        "type": "button",
                        "text": {
                          "type": "plain_text",
                          "text": "🔗 Workflow Run",
                          "emoji": true
                        },
                        "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                      }
                    ]
                  }
                ]
              }
            ]
          }
          EOF

          # Send to Slack
          curl -X POST \
            -H 'Content-type: application/json' \
            --data @slack-payload.json \
            ${{ secrets.SLACK_WEBHOOK_URL }}
