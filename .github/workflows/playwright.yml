name: Playwright Tests

on:
  # Run on push to dev or master branch
  push:
    branches: [ dev, master ]
  # Run on pull requests to dev or master
  pull_request:
    branches: [ dev, master ]
  # Run daily at 9 AM UTC
  schedule:
    - cron: '0 9 * * *'
  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    
    - name: Cache node modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          node-modules-${{ runner.os }}-
    
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          playwright-browsers-${{ runner.os }}-
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Load Allure history from previous runs
      uses: actions/checkout@v4
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages
        
    - name: Copy Allure history to results
      if: always()
      continue-on-error: true
      run: |
        if [ -d "gh-pages/allure-history" ]; then
          mkdir -p allure-results/history
          cp -r gh-pages/allure-history/* allure-results/history/
          echo "Loaded history from previous runs"
        else
          echo "No previous history found"
        fi
      
    - name: Run Playwright tests
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      
    - name: Upload Allure results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-results-${{ matrix.shardIndex }}
        path: allure-results/
        retention-days: 7
        
    - name: Upload HAR analysis reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: har-reports-${{ matrix.shardIndex }}
        path: reports/
        retention-days: 30
        
    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-${{ matrix.shardIndex }}
        path: playwright-report/
        retention-days: 7

  merge-reports:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all Allure results
      uses: actions/download-artifact@v4
      with:
        path: all-allure-results
        pattern: allure-results-*
        merge-multiple: true
        
    - name: Download all HAR reports
      uses: actions/download-artifact@v4
      if: always()
      continue-on-error: true
      with:
        path: all-har-reports
        pattern: har-reports-*
        merge-multiple: true
    
    - name: Load Allure history from previous runs
      uses: actions/checkout@v4
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages
        
    - name: Generate Allure Report
      run: |
        npm install -g allure-commandline
        # Copy history before generating report
        if [ -d "gh-pages/allure-history" ]; then
          cp -r gh-pages/allure-history all-allure-results/history
        fi
        # Generate fresh report with history
        allure generate all-allure-results -o allure-report --clean
        
    - name: Save Allure history
      run: |
        mkdir -p allure-history
        cp -r allure-report/history/* allure-history/
        
    - name: Upload Allure history
      uses: actions/upload-artifact@v4
      with:
        name: allure-history
        path: allure-history/
        retention-days: 90
        
    - name: Upload Allure report
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report/
        retention-days: 7
        
    - name: Generate HAR Analysis Summary
      if: always()
      continue-on-error: true
      run: |
        echo "# 🔍 HAR Analysis Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -f "all-har-reports/aggregate-analysis.json" ]; then
          TOTAL_ANOMALIES=$(cat all-har-reports/aggregate-analysis.json | jq -r '.totalAnomalies // 0')
          ERROR_COUNT=$(cat all-har-reports/aggregate-analysis.json | jq -r '.errorCount // 0')
          SLOW_COUNT=$(cat all-har-reports/aggregate-analysis.json | jq -r '.slowResponseCount // 0')
          LARGE_COUNT=$(cat all-har-reports/aggregate-analysis.json | jq -r '.largeSizeCount // 0')
          
          if [ "$TOTAL_ANOMALIES" -eq 0 ]; then
            echo "## ✅ No Issues Detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All network requests performed within acceptable thresholds." >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ Issues Found: $TOTAL_ANOMALIES" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Category | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ HTTP Errors | $ERROR_COUNT |" >> $GITHUB_STEP_SUMMARY
            echo "| 🐌 Slow Responses | $SLOW_COUNT |" >> $GITHUB_STEP_SUMMARY
            echo "| 📦 Large Payloads | $LARGE_COUNT |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🤖 AI Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "all-har-reports/ai-report.txt" ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat all-har-reports/ai-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "_AI report not generated (GROQ_API_KEY may not be configured)_" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 Download [HAR Analysis Reports](../../actions/runs/${{ github.run_id }}) from workflow artifacts" >> $GITHUB_STEP_SUMMARY
        else
          echo "ℹ️ No HAR files were analyzed (tests may not have HAR recording enabled)" >> $GITHUB_STEP_SUMMARY
        fi
        
    - name: Upload merged HAR reports
      uses: actions/upload-artifact@v4
      if: always()
      continue-on-error: true
      with:
        name: har-analysis-report
        path: all-har-reports/
        retention-days: 30

  deploy-report:
    needs: merge-reports
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'schedule') && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
    steps:
    - name: Download Allure report
      uses: actions/download-artifact@v4
      with:
        name: allure-report
        path: allure-report
        
    - name: Deploy Allure report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-report
        keep_files: false

  notify:
    needs: [test, merge-reports]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - uses: actions/checkout@v4
    
    - name: Download Allure report
      uses: actions/download-artifact@v4
      with:
        name: allure-report
        path: allure-report
        
    - name: Download HAR analysis reports
      uses: actions/download-artifact@v4
      if: always()
      continue-on-error: true
      with:
        name: har-analysis-report
        path: har-reports
        
    - name: Extract test statistics
      id: stats
      run: |
        # Extract stats from Allure widgets.json
        PASSED=$(cat allure-report/widgets/summary.json | jq -r '.statistic.passed // 0')
        FAILED=$(cat allure-report/widgets/summary.json | jq -r '.statistic.failed // 0')
        BROKEN=$(cat allure-report/widgets/summary.json | jq -r '.statistic.broken // 0')
        SKIPPED=$(cat allure-report/widgets/summary.json | jq -r '.statistic.skipped // 0')
        TOTAL=$(cat allure-report/widgets/summary.json | jq -r '.statistic.total // 0')
        
        echo "passed=$PASSED" >> $GITHUB_OUTPUT
        echo "failed=$FAILED" >> $GITHUB_OUTPUT
        echo "broken=$BROKEN" >> $GITHUB_OUTPUT
        echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT
        echo "total=$TOTAL" >> $GITHUB_OUTPUT
        
        # Extract HAR analysis stats
        if [ -f "har-reports/aggregate-analysis.json" ]; then
          HAR_TOTAL=$(cat har-reports/aggregate-analysis.json | jq -r '.totalAnomalies // 0')
          HAR_ERRORS=$(cat har-reports/aggregate-analysis.json | jq -r '.errorCount // 0')
          HAR_SLOW=$(cat har-reports/aggregate-analysis.json | jq -r '.slowResponseCount // 0')
          HAR_LARGE=$(cat har-reports/aggregate-analysis.json | jq -r '.largeSizeCount // 0')
        else
          HAR_TOTAL=0
          HAR_ERRORS=0
          HAR_SLOW=0
          HAR_LARGE=0
        fi
        
        echo "har_total=$HAR_TOTAL" >> $GITHUB_OUTPUT
        echo "har_errors=$HAR_ERRORS" >> $GITHUB_OUTPUT
        echo "har_slow=$HAR_SLOW" >> $GITHUB_OUTPUT
        echo "har_large=$HAR_LARGE" >> $GITHUB_OUTPUT
    
    - name: Prepare and send Slack notification
      run: |
        # Determine test status icon
        if [[ "${{ needs.test.result }}" == "success" ]]; then
          TEST_STATUS_ICON="✅"
        else
          TEST_STATUS_ICON="❌"
        fi
        
        # Replace placeholders in template
        sed -e "s|{{TEST_STATUS_ICON}}|$TEST_STATUS_ICON|g" \
            -e "s|{{TEST_STATUS}}|${{ needs.test.result }}|g" \
            -e "s|{{REPOSITORY}}|${{ github.repository }}|g" \
            -e "s|{{BRANCH}}|${{ github.ref_name }}|g" \
            -e "s|{{ACTOR}}|${{ github.actor }}|g" \
            -e "s|{{EVENT}}|${{ github.event_name }}|g" \
            -e "s|{{PASSED}}|${{ steps.stats.outputs.passed }}|g" \
            -e "s|{{FAILED}}|${{ steps.stats.outputs.failed }}|g" \
            -e "s|{{BROKEN}}|${{ steps.stats.outputs.broken }}|g" \
            -e "s|{{SKIPPED}}|${{ steps.stats.outputs.skipped }}|g" \
            -e "s|{{TOTAL}}|${{ steps.stats.outputs.total }}|g" \
            -e "s|{{HAR_TOTAL}}|${{ steps.stats.outputs.har_total }}|g" \
            -e "s|{{HAR_ERRORS}}|${{ steps.stats.outputs.har_errors }}|g" \
            -e "s|{{HAR_SLOW}}|${{ steps.stats.outputs.har_slow }}|g" \
            -e "s|{{HAR_LARGE}}|${{ steps.stats.outputs.har_large }}|g" \
            -e "s|{{WORKFLOW_URL}}|${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|g" \
            .github/slack-notification-template.json > slack-payload.json
        
        # Send to Slack with AI report attachment if it exists
        if [ -f "har-reports/ai-report.txt" ]; then
          # Upload file to Slack first
          curl -F file=@har-reports/ai-report.txt \
               -F "initial_comment=🤖 HAR Analysis AI Report" \
               -F channels=${{ secrets.SLACK_CHANNEL_ID }} \
               -H "Authorization: Bearer ${{ secrets.SLACK_BOT_TOKEN }}" \
               https://slack.com/api/files.upload
        fi
        
        # Send main notification
        curl -X POST \
          -H 'Content-type: application/json' \
          --data @slack-payload.json \
          ${{ secrets.SLACK_WEBHOOK_URL }}
