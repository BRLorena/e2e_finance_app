name: Playwright Tests

on:
  # Run on push to dev or master branch (on merge)
  push:
    branches: [dev, master]
  # Run on pull requests to dev or master
  pull_request:
    branches: [dev, master]
  # Allow manual trigger from Actions tab
  workflow_dispatch:
  # Run daily at 09:00 UTC
  schedule:
    - cron: '0 9 * * *'

# Only one Pages publish at a time; a new run doesn't cancel one that is publishing.
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the reports to the gh-pages branch
    env:
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check BASE_URL is configured
        run: |
          if [ -z "${{ vars.BASE_URL }}" ]; then
            echo "::error::Set the BASE_URL repository variable (Settings > Secrets and variables > Actions > Variables)"
            exit 1
          fi

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        id: test-run
        continue-on-error: true
        run: npm test -- --workers=1
        env:
          BASE_URL: ${{ vars.BASE_URL }}

      # History of previous runs, published to GitHub Pages by the last publish.
      # Jev uses it to tell "always fails" from "sometimes fails"; Allure uses it for trends.
      - name: Download report history from GitHub Pages
        if: always()
        run: |
          mkdir -p .history
          curl -fsSL "$PAGES_URL/history.json" -o .history/triage.json && echo "Triage history downloaded" || echo "No triage history"
          curl -fsSL "$PAGES_URL/allure-history.jsonl" -o .history/allure.jsonl && echo "Allure history downloaded" || echo "No Allure history"

      # Jev classifies each failure as bug / flaky / environment (or needs_review).
      # Without the secret it runs in fallback mode (unclassified) and never breaks the pipeline.
      # It only fails the job for verdicts listed in the TRIAGE_FAIL_ON variable (empty by default).
      - name: Triage failures with Jev
        id: triage
        if: always()
        continue-on-error: true
        run: npm run triage
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          TRIAGE_FAIL_ON: ${{ vars.TRIAGE_FAIL_ON }}
          TRIAGE_CONFIDENCE_THRESHOLD: ${{ vars.TRIAGE_CONFIDENCE_THRESHOLD || '0.6' }}
          TRIAGE_TEST_DEFECT_THRESHOLD: ${{ vars.TRIAGE_TEST_DEFECT_THRESHOLD || '0.7' }}

      - name: Generate Allure report
        if: always()
        run: npm run allure

      - name: Generate Test Summary
        if: always()
        run: |
          echo "# 📊 Playwright Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.test-run.outcome }}" == "failure" ]]; then
            echo "## ❌ Some Tests Failed" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ✅ All Tests Passed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f reports/results.json ]; then
            jq -r '.stats | "| ✅ Passed | ❌ Failed | ⚠️ Flaky | ⏭️ Skipped |\n|---|---|---|---|\n| \(.expected) | \(.unexpected) | \(.flaky) | \(.skipped) |"' reports/results.json >> $GITHUB_STEP_SUMMARY
            FLAKY=$(jq -r '[.. | objects | select(has("specs")) | .specs[] | select(any(.tests[]; .status == "flaky")) | "- \(.file):\(.line) › \(.title)"] | .[]' reports/results.json)
            if [ -n "$FLAKY" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### ⚠️ Flaky tests (passed only on retry — treat as bugs)" >> $GITHUB_STEP_SUMMARY
              echo "$FLAKY" >> $GITHUB_STEP_SUMMARY
              echo "::warning::$(echo "$FLAKY" | wc -l) flaky test(s) passed only on retry"
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          echo "### 📈 Reports" >> $GITHUB_STEP_SUMMARY
          echo "- [Jev failure triage]($PAGES_URL/) and [Allure report]($PAGES_URL/allure/) on GitHub Pages (updated on master)" >> $GITHUB_STEP_SUMMARY
          echo "- 📥 This run's reports: [workflow artifacts](../../actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            playwright-report/
            reports/allure-report/
            reports/triage/
            reports/results.json
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      # Site layout: / = Jev triage, /allure/ = Allure report, /playwright-report/ = Playwright HTML report,
      # plus both history files so the next run can download them.
      - name: Build GitHub Pages site
        if: always() && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: |
          mkdir -p site
          cp reports/triage/index.html site/index.html
          cp reports/triage/history.json site/history.json
          cp -r reports/allure-report site/allure
          cp .history/allure.jsonl site/allure-history.jsonl 2>/dev/null || true
          cp -r playwright-report site/playwright-report 2>/dev/null || true

      - name: Deploy to GitHub Pages
        if: always() && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
          keep_files: false

      - name: Fail job if tests or blocking triage verdicts failed
        if: steps.test-run.outcome == 'failure' || steps.triage.outcome == 'failure'
        run: exit 1
